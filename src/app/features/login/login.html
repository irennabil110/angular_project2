<section class="login-page">

<div class="login-box">

    <h1>Login</h1>

    <div class="input-group">
        <label for="username">Username</label>

        <input
            type="text"
            id="username"
            placeholder="Enter your username">
    </div>


    <div class="input-group">
        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password">
    </div>


    <button class="login-btn">
        Login
    </button>

</div>

</section>
